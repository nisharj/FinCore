fincore:
  internal:
    secret: ${FINCORE_INTERNAL_SECRET}

spring:
  application:
    name: customer-service

  datasource:
    url: ${SPRING_DATASOURCE_URL_CUSTOMER:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}
