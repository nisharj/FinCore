spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customers/**
             
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/accounts,/accounts/{id},/accounts/customer/{customerId}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}
