spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL_AUTH:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

otp:
  hash-secret: ${OTP_HASH_SECRET}

fincore:
  internal:
    secret: ${FINCORE_INTERNAL_SECRET}
  customer-service:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

customer-service:
  url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
