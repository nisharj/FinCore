spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: fincore-super-secret-key-which-is-long-enough-123456
  expiration: 3600000

otp:
  hash-secret: ${OTP_HASH_SECRET}

fincore:
  internal:
    secret: ${FINCORE_INTERNAL_SECRET}

customer-service:
  url: http://localhost:8081