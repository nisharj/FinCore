server:
  port: 8084

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

fincore:
  internal:
    secret: ${FINCORE_INTERNAL_SECRET}

  reconciliation:
    fixed-delay: 30000 # 30 seconds

jwt:
  secret: ${JWT_SECRET}
  