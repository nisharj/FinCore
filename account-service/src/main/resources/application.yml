spring:
    application:
        name: account-service

    datasource:
        url: jdbc:postgresql://localhost:5432/account_db
        username: postgres
        password: 123456

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

server:
    port: 8082

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

jwt:
  secret: fincore-super-secret-key-which-is-long-enough-123456

fincore:
  internal:
    secret: ${FINCORE_INTERNAL_SECRET}